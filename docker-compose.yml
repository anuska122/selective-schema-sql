services:
  postgres:
    image: postgres:16
    container_name: sqlagent-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: bird
    ports:
      # Localhost only; 5432 and 5433 are taken on this machine.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bird"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
