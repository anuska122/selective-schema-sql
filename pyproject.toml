[project]
name = "sqlagent"
version = "0.1.0"
description = "Selective-schema text-to-SQL agent"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
# Setup scripts and tests build SQL from trusted identifiers (catalog names, fixed test strings).
"scripts/*" = ["S608"]
"tests/*" = ["S608"]
